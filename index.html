<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOUPED — Gradient Bowl Logo Reveal</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #F6EFE6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #wrap {
      width: min(860px, 100vw);
      aspect-ratio: 860 / 540;
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    #replay-btn {
      position: fixed;
      bottom: 26px;
      right: 26px;
      background: #0B0E2E;
      color: #F6EFE6;
      border: none;
      padding: 11px 24px;
      border-radius: 28px;
      font-size: 13px;
      font-family: 'Arial Black', Arial, sans-serif;
      cursor: pointer;
      letter-spacing: 1.2px;
      opacity: 0;
      pointer-events: none;
      transition: background 0.2s;
    }
    #replay-btn.ready { pointer-events: auto; }
    #replay-btn:hover { background: #7B61FF; }
  </style>
</head>
<body>
<div id="wrap">
  <svg viewBox="0 0 860 540" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Blob gradient: orange → pink → purple -->
      <radialGradient id="blobGrad" cx="36%" cy="36%" r="64%">
        <stop offset="0%"   stop-color="#FFA050"/>
        <stop offset="32%"  stop-color="#FF4DA5"/>
        <stop offset="68%"  stop-color="#A080FF"/>
        <stop offset="100%" stop-color="#7B61FF"/>
      </radialGradient>

      <!-- Bowl body gradient: medium → deep purple -->
      <linearGradient id="bowlBodyGrad" x1="10%" y1="0%" x2="90%" y2="100%">
        <stop offset="0%"   stop-color="#A080FF"/>
        <stop offset="55%"  stop-color="#7B61FF"/>
        <stop offset="100%" stop-color="#4A2ECC"/>
      </linearGradient>

      <!-- Bowl rim gradient -->
      <linearGradient id="bowlRimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%"   stop-color="#C8B0FF"/>
        <stop offset="100%" stop-color="#8B71EE"/>
      </linearGradient>

      <!-- Soup surface gradient -->
      <radialGradient id="soupGrad" cx="42%" cy="42%" r="58%">
        <stop offset="0%"   stop-color="#FFA850"/>
        <stop offset="100%" stop-color="#E05200"/>
      </radialGradient>

      <!-- Ladle gradient -->
      <linearGradient id="ladleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%"   stop-color="#EEE4FF"/>
        <stop offset="100%" stop-color="#9880CC"/>
      </linearGradient>

      <!-- Blob soft glow -->
      <filter id="blobGlow" x="-45%" y="-45%" width="190%" height="190%">
        <feGaussianBlur stdDeviation="14" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>

      <!-- Bowl drop shadow -->
      <filter id="bowlShadow" x="-18%" y="-18%" width="136%" height="136%">
        <feDropShadow dx="3" dy="7" stdDeviation="8"
                      flood-color="#0B0E2E" flood-opacity="0.18"/>
      </filter>
    </defs>

    <!-- ─────────────────────────────────────────────────────── -->
    <!-- HALFTONE LAYER  (populated by JS)                        -->
    <!-- ─────────────────────────────────────────────────────── -->
    <g id="ht-layer" opacity="0"/>

    <!-- ─────────────────────────────────────────────────────── -->
    <!-- STAGE 1 · GRADIENT BLOB                                  -->
    <!-- ─────────────────────────────────────────────────────── -->
    <path id="blob"
      d="M430,278
         C472,212 562,198 588,252
         C622,318 598,402 542,424
         C486,446 406,436 366,394
         C314,340 338,252 430,278Z"
      fill="url(#blobGrad)"
      filter="url(#blobGlow)"
      opacity="0"/>

    <!-- ─────────────────────────────────────────────────────── -->
    <!-- STAGE 2 · COMIC ACCENTS                                  -->
    <!-- ─────────────────────────────────────────────────────── -->
    <!-- 4-point stars -->
    <g id="s1" opacity="0">
      <path d="M0-16 4-5 15-5 7 2 10 14 0 8-10 14-7 2-15-5-4-5Z"
            fill="#FF4DA5" transform="translate(148,148)"/>
    </g>
    <g id="s2" opacity="0">
      <path d="M0-13 3-4 12-4 5.5 2 8 12 0 7-8 12-5.5 2-12-4-3-4Z"
            fill="#FF7A30" transform="translate(712,118)"/>
    </g>
    <g id="s3" opacity="0">
      <path d="M0-11 2.8-3.5 10.5-3.5 4.5 1 7 10 0 5.5-7 10-4.5 1-10.5-3.5-2.8-3.5Z"
            fill="#17C3FF" transform="translate(122,418)"/>
    </g>
    <g id="s4" opacity="0">
      <path d="M0-12 3-3.8 11-3.8 5 1.5 7.5 11 0 6-7.5 11-5 1.5-11-3.8-3-3.8Z"
            fill="#9CE05A" transform="translate(738,400)"/>
    </g>

    <!-- Tick / burst accent marks -->
    <g id="ticks" opacity="0" stroke-linecap="round">
      <line x1="174" y1="222" x2="194" y2="202" stroke="#FF4DA5" stroke-width="3.5"/>
      <line x1="186" y1="219" x2="206" y2="199" stroke="#FF4DA5" stroke-width="2.5"/>
      <line x1="678" y1="178" x2="698" y2="158" stroke="#FF7A30" stroke-width="3.5"/>
      <line x1="690" y1="175" x2="710" y2="155" stroke="#FF7A30" stroke-width="2.5"/>
      <!-- small plus near star-bl -->
      <line x1="108" y1="438" x2="108" y2="428" stroke="#17C3FF" stroke-width="2.5"/>
      <line x1="103" y1="433" x2="113" y2="433" stroke="#17C3FF" stroke-width="2.5"/>
      <!-- small plus near star-br -->
      <line x1="752" y1="382" x2="752" y2="372" stroke="#9CE05A" stroke-width="2.5"/>
      <line x1="747" y1="377" x2="757" y2="377" stroke="#9CE05A" stroke-width="2.5"/>
    </g>

    <!-- ─────────────────────────────────────────────────────── -->
    <!-- STAGE 3 · BOWL + LADLE                                   -->
    <!-- ─────────────────────────────────────────────────────── -->
    <g id="bowl-g" filter="url(#bowlShadow)">
      <!-- ground ellipse shadow -->
      <ellipse cx="608" cy="490" rx="76" ry="14" fill="#0B0E2E" opacity="0.10"/>
      <!-- pedestal base -->
      <ellipse cx="608" cy="482" rx="42" ry="10" fill="#4A2ECC"/>
      <rect    x="584"  y="462" width="48" height="24" rx="9" fill="#4A2ECC"/>
      <!-- bowl body -->
      <path id="bbody"
        d="M496,376
           C490,458 546,478 608,480
           C670,478 726,458 720,376Z"
        fill="url(#bowlBodyGrad)"/>
      <!-- bowl rim -->
      <ellipse id="brim"  cx="608" cy="376" rx="112" ry="28" fill="url(#bowlRimGrad)"/>
      <!-- soup surface -->
      <ellipse id="bsoup" cx="608" cy="376" rx="96"  ry="22" fill="url(#soupGrad)"/>
      <!-- inner dark stripe for depth -->
      <path d="M506,376 C504,390 552,397 608,397 C664,397 712,390 710,376"
            fill="#3B21C0" opacity="0.22"/>
      <!-- specular shines -->
      <ellipse cx="548" cy="408" rx="22" ry="12" fill="white" opacity="0.22"
               transform="rotate(-22 548 408)"/>
      <ellipse cx="535" cy="396" rx="8"  ry="5"  fill="white" opacity="0.40"
               transform="rotate(-22 535 396)"/>
    </g>

    <!-- ladle -->
    <g id="ladle-g">
      <rect   id="lhandle" x="698" y="278" width="14" height="114" rx="7"
              fill="url(#ladleGrad)"/>
      <ellipse id="lcup1"  cx="705" cy="394" rx="27"  ry="21" fill="#BEA8E0"/>
      <ellipse id="lcup2"  cx="705" cy="388" rx="20"  ry="14" fill="#DDD0F8" opacity="0.78"/>
      <ellipse             cx="697" cy="383" rx="5.5" ry="3.5" fill="white" opacity="0.50"/>
    </g>

    <!-- ─────────────────────────────────────────────────────── -->
    <!-- STAGE 4 · STEAM + VECTOR SHAPES                          -->
    <!-- ─────────────────────────────────────────────────────── -->
    <path class="stm" d="M574,370 Q566,342 572,318 Q578,294 570,272"
          stroke="white" stroke-width="5" fill="none" stroke-linecap="round" opacity="0"/>
    <path class="stm" d="M608,365 Q600,337 606,313 Q612,289 604,267"
          stroke="white" stroke-width="4.5" fill="none" stroke-linecap="round" opacity="0"/>
    <path class="stm" d="M642,370 Q650,342 644,318 Q638,294 646,272"
          stroke="white" stroke-width="5" fill="none" stroke-linecap="round" opacity="0"/>

    <!-- vector splash shapes (creativity ingredients) -->
    <path id="vOrange" d="M0-34C20-27 24-8 0 0C-24-8-20-27 0-34Z"
          fill="#FF7A30" opacity="0" transform="translate(672,212)"/>
    <circle id="vPink" cx="414" cy="248" r="24" fill="#FF4DA5" opacity="0"/>
    <path id="vPurple" d="M0-28C17-21 20-6 0 0C-20-6-17-21 0-28Z"
          fill="#7B61FF" opacity="0" transform="translate(516,200)"/>
    <path id="vGreen"  d="M0 0C9-14 23-17 23-5C23 9 9 14 0 0Z"
          fill="#9CE05A" opacity="0" transform="translate(543,182) rotate(30)"/>
    <path id="vCyan"   d="M0-32C14-22 17-8 0 0C-17-8-14-22 0-32Z"
          fill="#17C3FF" opacity="0" transform="translate(442,192)"/>

    <!-- ─────────────────────────────────────────────────────── -->
    <!-- STAGE 5 · SOUPED WORDMARK                                -->
    <!-- ─────────────────────────────────────────────────────── -->
    <g id="txt-g" opacity="0">
      <!-- orange chromatic offset -->
      <text id="txtO" x="305" y="326"
            font-family="'Arial Black','Impact','Helvetica Neue',sans-serif"
            font-size="94" font-weight="900" letter-spacing="-2"
            fill="none" stroke="#FF7A30" stroke-width="7"
            opacity="0">SOUPED</text>
      <!-- cyan chromatic offset -->
      <text id="txtC" x="299" y="320"
            font-family="'Arial Black','Impact','Helvetica Neue',sans-serif"
            font-size="94" font-weight="900" letter-spacing="-2"
            fill="none" stroke="#17C3FF" stroke-width="7"
            opacity="0">SOUPED</text>
      <!-- main dark text -->
      <text id="txtM" x="302" y="323"
            font-family="'Arial Black','Impact','Helvetica Neue',sans-serif"
            font-size="94" font-weight="900" letter-spacing="-2"
            fill="#0B0E2E"
            opacity="0">SOUPED</text>
    </g>

    <!-- ─────────────────────────────────────────────────────── -->
    <!-- STAGE 6 · LOCAL BADGE                                    -->
    <!-- ─────────────────────────────────────────────────────── -->
    <g id="badge-g" opacity="0">
      <rect x="204" y="252" width="106" height="32" rx="11" fill="#FFD700"/>
      <text x="257" y="274" text-anchor="middle"
            font-family="'Arial Black','Impact',sans-serif"
            font-size="14" font-weight="900" fill="#0B0E2E" letter-spacing="1.5">LOCAL</text>
    </g>
  </svg>
</div>

<button id="replay-btn">↺ REPLAY</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
/* ─── Halftone dot grid ─────────────────────────────────── */
(function buildHalftone() {
  const layer   = document.getElementById('ht-layer');
  const ns      = 'http://www.w3.org/2000/svg';
  const palette = ['#FF4DA5','#7B61FF','#FF7A30','#17C3FF','#9CE05A'];
  for (let col = 0; col < 24; col++) {
    for (let row = 0; row < 16; row++) {
      const x    = 14 + col * 36;
      const y    = 14 + row * 34;
      const dist = Math.hypot(x - 430, y - 320);
      const r    = Math.max(1.4, 5 - dist / 96);
      const c    = document.createElementNS(ns, 'circle');
      c.setAttribute('cx', x);
      c.setAttribute('cy', y);
      c.setAttribute('r',  r);
      c.setAttribute('fill', palette[(col * 3 + row * 2) % palette.length]);
      c.setAttribute('opacity', '0.32');
      layer.appendChild(c);
    }
  }
})();

/* ─── Initial (hidden) states ───────────────────────────── */
gsap.set('#blob',           { scale: 0, opacity: 0,   transformOrigin: '50% 50%' });
gsap.set(['#s1','#s2','#s3','#s4'],
                            { scale: 0, opacity: 0,   transformOrigin: '50% 50%' });
gsap.set('#ticks',          { opacity: 0 });
gsap.set('#ht-layer',       { opacity: 0 });
gsap.set('#bowl-g',         { y: 90,   opacity: 0 });
gsap.set('#ladle-g',        { x: 58, rotation: 24, opacity: 0, transformOrigin: '705px 320px' });
gsap.set('.stm',            { opacity: 0, y: 0 });
gsap.set(['#vOrange','#vPink','#vPurple','#vGreen','#vCyan'],
                            { scale: 0, opacity: 0,   transformOrigin: '50% 50%' });
gsap.set('#txt-g',          { opacity: 0 });
gsap.set('#txtM',           { scale: 1.20, opacity: 0, transformOrigin: '50% 50%' });
gsap.set(['#txtO','#txtC'], { opacity: 0 });
gsap.set('#badge-g',        { scale: 0,  opacity: 0, rotation: -12,
                              transformOrigin: '257px 268px' });

/* ─── Timeline builder ──────────────────────────────────── */
function buildTL() {
  const tl = gsap.timeline();

  /* ── 1  BLOB blooms with squash & stretch ── */
  tl.to('#blob', {
    duration: 1.25, scale: 1, opacity: 1,
    ease: 'elastic.out(1, 0.48)',
    transformOrigin: '50% 50%'
  }, 0)
  .fromTo('#blob',
    { scaleX: 1.40, scaleY: 0.70 },
    { duration: 0.95, scaleX: 1, scaleY: 1,
      ease: 'elastic.out(1.1, 0.44)',
      transformOrigin: '50% 50%' },
    0.07
  );

  /* ── 2  HALFTONE + COMIC STARS pop in ── */
  tl.to('#ht-layer', { duration: 0.55, opacity: 1 }, 0.98)
    .to('#s1', { duration: 0.40, scale: 1, opacity: 1, ease: 'back.out(2.6)',
                 transformOrigin: '148px 148px' }, 1.08)
    .to('#s2', { duration: 0.40, scale: 1, opacity: 1, ease: 'back.out(2.6)',
                 transformOrigin: '712px 118px' }, 1.18)
    .to('#s3', { duration: 0.34, scale: 1, opacity: 1, ease: 'back.out(2.6)',
                 transformOrigin: '122px 418px' }, 1.26)
    .to('#s4', { duration: 0.34, scale: 1, opacity: 1, ease: 'back.out(2.6)',
                 transformOrigin: '738px 400px' }, 1.34)
    .to('#ticks', { duration: 0.28, opacity: 1 }, 1.20);

  /* ── 3  BOWL ASSEMBLES, ladle swings in ── */
  tl.to('#blob',    { duration: 0.62, opacity: 0.12, scale: 0.62,
                      transformOrigin: '50% 50%' }, 1.70)
    .to('#ht-layer', { duration: 0.40, opacity: 0.44 }, 1.76)
    .to('#bowl-g',  { duration: 0.90, y: 0, opacity: 1,
                      ease: 'back.out(1.55)' }, 1.88)
    .to('#ladle-g', { duration: 0.72, x: 0, rotation: 0, opacity: 1,
                      ease: 'back.out(1.85)',
                      transformOrigin: '705px 320px' }, 2.32);

  /* ── 4  STEAM rises, VECTOR SHAPES burst out ── */
  tl.to('.stm', {
    duration: 1.02, opacity: 0.78, y: -20,
    stagger: 0.14, ease: 'power1.out'
  }, 3.06)
  .to('#vOrange', { duration: 0.55, scale: 1, opacity: 1, ease: 'back.out(2.5)',
                    transformOrigin: '672px 212px' }, 3.16)
  .to('#vPink',   { duration: 0.55, scale: 1, opacity: 1, ease: 'back.out(2.5)',
                    transformOrigin: '414px 248px' }, 3.26)
  .to('#vPurple', { duration: 0.55, scale: 1, opacity: 1, ease: 'back.out(2.5)',
                    transformOrigin: '516px 200px' }, 3.35)
  .to('#vGreen',  { duration: 0.55, scale: 1, opacity: 1, ease: 'back.out(2.5)',
                    transformOrigin: '543px 182px' }, 3.44)
  .to('#vCyan',   { duration: 0.55, scale: 1, opacity: 1, ease: 'back.out(2.5)',
                    transformOrigin: '442px 192px' }, 3.52);

  /* ── 5  SOUPED WORDMARK: chromatic layers then main pop ── */
  tl.set('#txt-g',  { opacity: 1 }, 4.10)
    .to('#txtO',    { duration: 0.24, opacity: 0.78 }, 4.10)
    .to('#txtC',    { duration: 0.24, opacity: 0.78 }, 4.17)
    .to('#txtM',    { duration: 0.60, opacity: 1, scale: 1,
                      ease: 'back.out(2.2)',
                      transformOrigin: '50% 50%' }, 4.28)
    .to(['#txtO','#txtC'], { duration: 0.40, opacity: 0.42 }, 4.68);

  /* ── 6  LOCAL BADGE snaps in ── */
  tl.to('#badge-g', {
    duration: 0.50, scale: 1, opacity: 1, rotation: 0,
    ease: 'back.out(3.2)',
    transformOrigin: '257px 268px'
  }, 5.18);

  /* ── Final settle bounce ── */
  tl.to(['#bowl-g','#txt-g','#badge-g'],
    { duration: 0.24, y: '-=8', ease: 'power2.out' }, 5.48)
  .to(['#bowl-g','#txt-g','#badge-g'],
    { duration: 0.36, y: '+=8', ease: 'bounce.out' }, 5.72)
  .to('.stm', { duration: 0.50, opacity: 0.34 }, 5.52);

  /* ── Replay button fades in ── */
  tl.to('#replay-btn', { duration: 0.50, opacity: 1 }, 6.20);

  return tl;
}

/* ─── Run & wire replay ──────────────────────────────────── */
let tl = buildTL();

const btn = document.getElementById('replay-btn');
tl.eventCallback('onComplete', () => btn.classList.add('ready'));

function resetAndReplay() {
  btn.classList.remove('ready');

  gsap.set('#blob',           { scale: 0, opacity: 0 });
  gsap.set(['#s1','#s2','#s3','#s4'], { scale: 0, opacity: 0 });
  gsap.set('#ticks',          { opacity: 0 });
  gsap.set('#ht-layer',       { opacity: 0 });
  gsap.set('#bowl-g',         { y: 90, opacity: 0 });
  gsap.set('#ladle-g',        { x: 58, rotation: 24, opacity: 0 });
  gsap.set('.stm',            { opacity: 0, y: 0 });
  gsap.set(['#vOrange','#vPink','#vPurple','#vGreen','#vCyan'],
                              { scale: 0, opacity: 0 });
  gsap.set('#txt-g',          { opacity: 0 });
  gsap.set('#txtM',           { scale: 1.20, opacity: 0 });
  gsap.set(['#txtO','#txtC'], { opacity: 0 });
  gsap.set('#badge-g',        { scale: 0, opacity: 0, rotation: -12 });
  gsap.set('#replay-btn',     { opacity: 0 });

  tl.kill();
  tl = buildTL();
  tl.eventCallback('onComplete', () => btn.classList.add('ready'));
}

btn.addEventListener('click', resetAndReplay);
</script>
</body>
</html>
