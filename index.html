<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOUPED — Logo Reveal</title>
<style>
/* ── Reset ──────────────────────────────────────────────── */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #F2EDE4;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  overflow: hidden;
  font-family: 'Arial Black', Impact, sans-serif;
}

/* ── Stage ──────────────────────────────────────────────── */
#stage {
  position: relative;
  width: 860px;
  height: 540px;
  max-width: 100vw;
}

/* ── Shared: all pieces start hidden ────────────────────── */
.piece { opacity: 0; }

/* ══════════════════════════════════════════════════════════
   KEYFRAMES
══════════════════════════════════════════════════════════ */

/* Halftone field fades + expands */
@keyframes htIn {
  from { opacity: 0; transform: scale(0.6); }
  to   { opacity: 1; transform: scale(1); }
}

/* Speed lines shoot in from center */
@keyframes lineShoot {
  0%   { stroke-dashoffset: 350; opacity: 0; }
  20%  { opacity: 1; }
  100% { stroke-dashoffset: 0;   opacity: 1; }
}

/* Bowl thuds up from below */
@keyframes bowlIn {
  0%   { transform: translateY(140px) rotate(-6deg); opacity: 0; }
  60%  { transform: translateY(-18px) rotate(2deg);  opacity: 1; }
  78%  { transform: translateY(10px)  rotate(-1deg); }
  90%  { transform: translateY(-5px)  rotate(0.5deg); }
  100% { transform: translateY(0)     rotate(0deg);  opacity: 1; }
}

/* Bowl tilts up like the middle reference panel */
@keyframes bowlTilt {
  0%   { transform: rotate(0deg) translateY(0); }
  100% { transform: rotate(-22deg) translateY(-30px) scale(1.06); }
}

/* Bowl comes back to rest */
@keyframes bowlSettle {
  0%   { transform: rotate(-22deg) translateY(-30px) scale(1.06); }
  60%  { transform: rotate(3deg)   translateY(8px)  scale(0.97); }
  80%  { transform: rotate(-1deg)  translateY(-3px); }
  100% { transform: rotate(0deg)   translateY(0)    scale(1); }
}

/* Burst spikes explode outward */
@keyframes spikeOut {
  0%   { transform: scaleY(0) translateY(10px); opacity: 0; }
  50%  { opacity: 1; }
  100% { transform: scaleY(1) translateY(0);    opacity: 1; }
}

/* Comic shapes pop with overshoot */
@keyframes comicPop {
  0%   { transform: scale(0) rotate(-30deg); opacity: 0; }
  65%  { transform: scale(1.25) rotate(5deg); opacity: 1; }
  82%  { transform: scale(0.9) rotate(-2deg); }
  100% { transform: scale(1) rotate(0deg);    opacity: 1; }
}

/* Stars spin-in */
@keyframes starSpin {
  0%   { transform: scale(0) rotate(-180deg); opacity: 0; }
  70%  { transform: scale(1.2) rotate(10deg); opacity: 1; }
  100% { transform: scale(1) rotate(0deg);    opacity: 1; }
}

/* Text slams from above */
@keyframes textSlam {
  0%   { transform: translateY(-80px) scaleY(1.4); opacity: 0; }
  55%  { transform: translateY(12px) scaleY(0.88); opacity: 1; }
  75%  { transform: translateY(-6px) scaleY(1.04); }
  90%  { transform: translateY(3px) scaleY(0.98); }
  100% { transform: translateY(0) scaleY(1);       opacity: 1; }
}

/* Badge drops + bounces */
@keyframes badgeDrop {
  0%   { transform: translateY(-60px) rotate(8deg) scale(0.5); opacity: 0; }
  55%  { transform: translateY(10px)  rotate(-3deg) scale(1.08); opacity: 1; }
  75%  { transform: translateY(-4px)  rotate(1deg); }
  100% { transform: translateY(0)     rotate(0deg) scale(1);    opacity: 1; }
}

/* Accent tick flash */
@keyframes tickIn {
  0%   { transform: scaleX(0); opacity: 0; }
  60%  { transform: scaleX(1.2); opacity: 1; }
  100% { transform: scaleX(1);   opacity: 1; }
}

/* Ground shadow pulse */
@keyframes shadowPulse {
  0%, 100% { transform: scaleX(1);   opacity: 0.12; }
  50%       { transform: scaleX(1.18); opacity: 0.22; }
}

/* Chromatic shake on text */
@keyframes chromaOff {
  0%,100% { transform: translate(0,0); }
  25%     { transform: translate(4px, -2px); }
  50%     { transform: translate(-3px, 2px); }
  75%     { transform: translate(2px, 3px); }
}

/* ── Replay button ──────────────────────────────────────── */
#replay-btn {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: #0B0E2E;
  color: #F2EDE4;
  border: none;
  padding: 11px 24px;
  border-radius: 28px;
  font-size: 13px;
  font-family: 'Arial Black', sans-serif;
  cursor: pointer;
  letter-spacing: 1px;
  opacity: 0;
  transition: background .2s, opacity .4s;
  pointer-events: none;
}
#replay-btn.show { opacity: 1; pointer-events: auto; }
#replay-btn:hover { background: #7B61FF; }
</style>
</head>
<body>
<div id="stage">
<svg id="svg" viewBox="0 0 860 540" xmlns="http://www.w3.org/2000/svg"
     style="width:100%;height:100%;overflow:visible">
<defs>
  <!-- Halftone pattern -->
  <pattern id="htPat" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="11" cy="11" r="3.5" fill="#FF4DA5" opacity="0.35"/>
  </pattern>
  <pattern id="htPat2" x="0" y="0" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="11" cy="11" r="3.5" fill="#7B61FF" opacity="0.30"/>
  </pattern>

  <!-- Bowl gradients -->
  <linearGradient id="panGrad" x1="0%" y1="0%" x2="60%" y2="100%">
    <stop offset="0%"   stop-color="#9B7AFF"/>
    <stop offset="50%"  stop-color="#7B61FF"/>
    <stop offset="100%" stop-color="#3D1FA8"/>
  </linearGradient>
  <radialGradient id="interiorGrad" cx="50%" cy="40%" r="55%">
    <stop offset="0%"  stop-color="#2A1060"/>
    <stop offset="100%" stop-color="#100030"/>
  </radialGradient>
  <linearGradient id="rimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%"   stop-color="#C0A8FF"/>
    <stop offset="100%" stop-color="#7B61FF"/>
  </linearGradient>
  <radialGradient id="soupGrad" cx="40%" cy="40%" r="60%">
    <stop offset="0%"  stop-color="#FFA850"/>
    <stop offset="100%" stop-color="#E05000"/>
  </radialGradient>

  <!-- Drop shadow -->
  <filter id="ds" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="4" dy="8" stdDeviation="10" flood-color="#0B0E2E" flood-opacity="0.30"/>
  </filter>
  <filter id="textDs" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="5" dy="5" stdDeviation="0" flood-color="#FF7A30" flood-opacity="1"/>
  </filter>
</defs>

<!-- ── HALFTONE FIELDS ─────────────────────────────────── -->
<g id="ht1" class="piece" style="transform-origin:200px 420px">
  <rect x="40"  y="340" width="320" height="160" rx="4" fill="url(#htPat)"/>
</g>
<g id="ht2" class="piece" style="transform-origin:680px 420px">
  <rect x="500" y="340" width="320" height="160" rx="4" fill="url(#htPat2)"/>
</g>

<!-- ── BURST SPIKES (explosion from bowl) ─────────────── -->
<g id="spikes" class="piece" style="transform-origin:430px 370px">
  <!-- spikes radiate outward -->
  <polygon points="430,370 410,180 450,180" fill="#FF7A30" opacity="0.92"/>
  <polygon points="430,370 340,200 370,230" fill="#0B0E2E" opacity="0.88"/>
  <polygon points="430,370 500,185 530,215" fill="#7B61FF" opacity="0.92"/>
  <polygon points="430,370 240,280 250,310" fill="#FF4DA5" opacity="0.85"/>
  <polygon points="430,370 600,260 600,295" fill="#0B0E2E" opacity="0.88"/>
  <polygon points="430,370 380,160 420,158" fill="#7B61FF" opacity="0.75"/>
  <polygon points="430,370 480,162 510,175" fill="#FF7A30" opacity="0.80"/>
  <polygon points="430,370 290,230 310,260" fill="#0B0E2E" opacity="0.75"/>
  <polygon points="430,370 550,230 560,265" fill="#FF4DA5" opacity="0.70"/>
</g>

<!-- ── SPEED LINES ─────────────────────────────────────── -->
<g id="lines" class="piece">
  <!-- lines from bowl center outward, staggered -->
  <line x1="430" y1="360" x2="120" y2="180" stroke="#0B0E2E" stroke-width="3" stroke-dasharray="350" stroke-dashoffset="350"/>
  <line x1="430" y1="360" x2="740" y2="175" stroke="#0B0E2E" stroke-width="3" stroke-dasharray="350" stroke-dashoffset="350"/>
  <line x1="430" y1="360" x2="80"  y2="340" stroke="#FF7A30" stroke-width="2" stroke-dasharray="350" stroke-dashoffset="350"/>
  <line x1="430" y1="360" x2="780" y2="330" stroke="#7B61FF" stroke-width="2" stroke-dasharray="350" stroke-dashoffset="350"/>
  <line x1="430" y1="360" x2="200" y2="80"  stroke="#FF4DA5" stroke-width="2.5" stroke-dasharray="400" stroke-dashoffset="400"/>
  <line x1="430" y1="360" x2="660" y2="82"  stroke="#FF4DA5" stroke-width="2.5" stroke-dasharray="400" stroke-dashoffset="400"/>
  <line x1="430" y1="360" x2="50"  y2="500" stroke="#0B0E2E" stroke-width="2" stroke-dasharray="300" stroke-dashoffset="300"/>
  <line x1="430" y1="360" x2="810" y2="500" stroke="#0B0E2E" stroke-width="2" stroke-dasharray="300" stroke-dashoffset="300"/>
</g>

<!-- ── BOWL (SVG illustration) ────────────────────────── -->
<g id="bowl" class="piece" filter="url(#ds)" style="transform-origin:430px 390px">
  <!-- ground shadow -->
  <ellipse id="gShadow" cx="430" cy="488" rx="130" ry="18"
           fill="#0B0E2E" opacity="0.12"
           style="animation:shadowPulse 1.4s ease-in-out infinite; animation-play-state:paused"/>

  <!-- Pedestal -->
  <ellipse cx="430" cy="476" rx="52" ry="13" fill="#3D1FA8"/>
  <rect x="402" y="458" width="56" height="22" rx="10" fill="#3D1FA8"/>

  <!-- Bowl body -->
  <path d="M300,375
           C295,458 356,480 430,482
           C504,480 566,458 560,375Z"
        fill="url(#panGrad)"/>

  <!-- Bowl rim -->
  <ellipse cx="430" cy="375" rx="130" ry="32" fill="url(#rimGrad)"/>

  <!-- Soup surface -->
  <ellipse cx="430" cy="375" rx="112" ry="26" fill="url(#soupGrad)"/>

  <!-- Interior dark ring -->
  <path d="M310,375 C308,390 364,400 430,400 C496,400 552,390 550,375"
        fill="#2A0A70" opacity="0.28"/>

  <!-- Bowl shine -->
  <ellipse cx="366" cy="408" rx="28" ry="14" fill="white" opacity="0.20"
           transform="rotate(-20 366 408)"/>
  <ellipse cx="352" cy="396" rx="10" ry="6"  fill="white" opacity="0.36"
           transform="rotate(-20 352 396)"/>

  <!-- Handle -->
  <path d="M556,382 C580,378 620,370 640,365 C650,360 648,388 638,390
           C618,395 580,398 556,396Z"
        fill="#C8C0E0"/>
  <path d="M556,384 C578,380 616,373 636,368 C638,378 636,386 634,388
           C614,393 578,396 556,394Z"
        fill="#B0A8D0"/>
  <!-- Handle bolt -->
  <circle cx="634" cy="379" r="7"  fill="#A098C0"/>
  <circle cx="634" cy="379" r="4"  fill="#E0D8F0"/>
  <circle cx="634" cy="379" r="1.5" fill="#7068A0"/>
</g>

<!-- ── COMIC ACCENTS ────────────────────────────────────── -->
<!-- Stars -->
<g id="star1" class="piece" style="transform-origin:148px 145px">
  <path d="M148,128 L152,138 163,138 154,145 157,157 148,150 139,157 142,145 133,138 144,138Z"
        fill="#FF4DA5"/>
</g>
<g id="star2" class="piece" style="transform-origin:714px 118px">
  <path d="M714,101 L718,112 730,112 720,119 724,131 714,124 704,131 708,119 698,112 710,112Z"
        fill="#FF7A30"/>
</g>
<g id="star3" class="piece" style="transform-origin:118px 414px">
  <path d="M118,400 L121,409 130,409 123,415 126,424 118,418 110,424 113,415 106,409 115,409Z"
        fill="#17C3FF"/>
</g>
<g id="star4" class="piece" style="transform-origin:742px 400px">
  <path d="M742,386 L745,396 756,396 748,403 751,413 742,407 733,413 736,403 728,396 739,396Z"
        fill="#9CE05A"/>
</g>

<!-- Exclamation + burst marks -->
<g id="excl1" class="piece" style="transform-origin:790px 80px">
  <rect x="786" y="55" width="8" height="28" rx="4" fill="#0B0E2E"/>
  <circle cx="790" cy="93" r="5" fill="#0B0E2E"/>
</g>
<g id="excl2" class="piece" style="transform-origin:72px 100px">
  <rect x="68" y="75"  width="8" height="22" rx="4" fill="#FF7A30"/>
  <circle cx="72" cy="107" r="4" fill="#FF7A30"/>
</g>

<!-- Tick accent marks -->
<g id="ticks" class="piece">
  <line x1="178" y1="222" x2="200" y2="200" stroke="#FF4DA5" stroke-width="4" stroke-linecap="round"/>
  <line x1="190" y1="218" x2="212" y2="196" stroke="#FF4DA5" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="198" y1="212" x2="220" y2="190" stroke="#FF4DA5" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="662" y1="200" x2="684" y2="178" stroke="#FF7A30" stroke-width="4" stroke-linecap="round"/>
  <line x1="674" y1="196" x2="696" y2="174" stroke="#FF7A30" stroke-width="2.5" stroke-linecap="round"/>
</g>

<!-- ── WORDMARK ─────────────────────────────────────────── -->
<g id="txtGroup" class="piece" style="transform-origin:300px 295px">
  <!-- orange hard shadow (offset) -->
  <text x="310" y="328"
        font-family="'Arial Black',Impact,sans-serif"
        font-size="100" font-weight="900" letter-spacing="-3"
        fill="#FF7A30">SOUPED</text>
  <!-- cyan shadow -->
  <text x="296" y="315"
        font-family="'Arial Black',Impact,sans-serif"
        font-size="100" font-weight="900" letter-spacing="-3"
        fill="#17C3FF" opacity="0.6">SOUPED</text>
  <!-- main dark text -->
  <text id="txtMain" x="303" y="322"
        font-family="'Arial Black',Impact,sans-serif"
        font-size="100" font-weight="900" letter-spacing="-3"
        fill="#0B0E2E">SOUPED</text>
</g>

<!-- ── LOCAL BADGE ──────────────────────────────────────── -->
<g id="badge" class="piece" style="transform-origin:248px 268px">
  <rect x="196" y="252" width="104" height="32" rx="10" fill="#FFD700"/>
  <text x="248" y="274" text-anchor="middle"
        font-family="'Arial Black',Impact,sans-serif"
        font-size="14" font-weight="900" fill="#0B0E2E" letter-spacing="1.5">LOCAL</text>
</g>
</svg>
</div>

<button id="replay-btn">↺ REPLAY</button>

<script>
/* ─── Utility: animate a class with given animation string ──────── */
function play(id, anim, delay, duration, fill, cb) {
  var el = document.getElementById(id) || document.querySelector(id);
  if (!el) return;
  el.style.opacity = '';          // let animation control opacity
  el.style.animation = 'none';
  el.offsetHeight;                // force reflow
  el.style.animation = anim + ' ' + duration + 's cubic-bezier(.22,.68,0,1.2) '
                      + delay + 's ' + (fill || 'forwards');
  if (cb) setTimeout(cb, (delay + duration) * 1000);
}

/* ─── Animate SVG line dashoffset via WAAPI ────────────────────── */
function shootLine(lineEl, delay, dur) {
  var offset = parseFloat(lineEl.getAttribute('stroke-dashoffset') || 350);
  lineEl.animate(
    [
      { strokeDashoffset: offset, opacity: 0 },
      { strokeDashoffset: offset * 0.9, opacity: 1, offset: 0.1 },
      { strokeDashoffset: 0, opacity: 1 }
    ],
    { duration: dur * 1000, delay: delay * 1000, fill: 'forwards',
      easing: 'cubic-bezier(0.1,0.4,0.2,1)' }
  );
}

/* ─── Main sequence ────────────────────────────────────────────── */
function runSequence() {
  /* All pieces hidden at start */
  document.querySelectorAll('.piece').forEach(function(el) {
    el.style.animation = 'none';
    el.style.opacity = '0';
  });
  document.getElementById('replay-btn').classList.remove('show');

  /* Timing anchors (seconds) */
  var T = {
    ht:      0.1,
    lines:   0.25,
    spikes:  0.45,
    bowl:    0.30,
    ticks:   0.70,
    stars:   0.80,
    excl:    0.92,
    tilt:    1.10,   // bowl tilts up
    settle:  1.55,   // bowl settles back
    text:    1.80,
    badge:   2.20,
    done:    2.80
  };

  /* ── 1  Halftone fields ── */
  play('ht1', 'htIn', T.ht,   0.50, 'forwards');
  play('ht2', 'htIn', T.ht + 0.08, 0.50, 'forwards');

  /* ── 2  Speed lines (WAAPI for dashoffset) ── */
  var linesGroup = document.getElementById('lines');
  linesGroup.style.opacity = '1';
  linesGroup.style.animation = 'none';
  var lines = linesGroup.querySelectorAll('line');
  lines.forEach(function(line, i) {
    shootLine(line, T.lines + i * 0.04, 0.55);
  });

  /* ── 3  Bowl thuds in ── */
  play('bowl', 'bowlIn', T.bowl, 0.70, 'forwards', function() {
    /* After landing: tilt up */
    play('bowl', 'bowlTilt', 0, 0.28, 'forwards', function() {
      /* Spikes explode while bowl is tilted */
      play('spikes', 'spikeOut', 0, 0.35, 'forwards');
      /* Settle back */
      setTimeout(function() {
        play('bowl', 'bowlSettle', 0, 0.50, 'forwards');
        /* Ground shadow starts pulsing */
        var sh = document.getElementById('gShadow');
        if (sh) sh.style.animationPlayState = 'running';
      }, 180);
    });
  });

  /* ── 4  Ticks & stars ── */
  play('ticks', 'tickIn', T.ticks, 0.25, 'forwards');
  play('star1', 'starSpin', T.stars,        0.38, 'forwards');
  play('star2', 'starSpin', T.stars + 0.10, 0.38, 'forwards');
  play('star3', 'starSpin', T.stars + 0.18, 0.32, 'forwards');
  play('star4', 'starSpin', T.stars + 0.26, 0.32, 'forwards');
  play('excl1', 'comicPop', T.excl,        0.30, 'forwards');
  play('excl2', 'comicPop', T.excl + 0.12, 0.30, 'forwards');

  /* ── 5  SOUPED text slams in ── */
  play('txtGroup', 'textSlam', T.text, 0.50, 'forwards', function() {
    /* brief chromatic shake */
    document.getElementById('txtMain').style.animation =
      'chromaOff 0.18s steps(1) 3';
  });

  /* ── 6  LOCAL badge drops ── */
  play('badge', 'badgeDrop', T.badge, 0.45, 'forwards');

  /* ── Done: show replay ── */
  setTimeout(function() {
    document.getElementById('replay-btn').classList.add('show');
  }, T.done * 1000);
}

/* ─── Boot & replay ─────────────────────────────────────────────── */
document.addEventListener('DOMContentLoaded', function() {
  runSequence();
  document.getElementById('replay-btn').addEventListener('click', runSequence);
});
</script>
</body>
</html>
