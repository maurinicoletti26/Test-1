<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOUPED — Gradient Bowl Logo Reveal</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #F6EFE6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #wrap {
      width: min(860px, 100vw);
      aspect-ratio: 860 / 540;
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    /* Critical: makes transform-origin relative to each element's own box */
    svg * {
      transform-box: fill-box;
      transform-origin: center center;
    }

    #replay-btn {
      position: fixed;
      bottom: 26px;
      right: 26px;
      background: #0B0E2E;
      color: #F6EFE6;
      border: none;
      padding: 11px 24px;
      border-radius: 28px;
      font-size: 13px;
      font-family: 'Arial Black', Arial, sans-serif;
      cursor: pointer;
      letter-spacing: 1.2px;
      opacity: 0;
      pointer-events: none;
      transition: background 0.2s;
    }
    #replay-btn.ready { pointer-events: auto; }
    #replay-btn:hover { background: #7B61FF; }
  </style>
</head>
<body>
<div id="wrap">
  <svg id="stage" viewBox="0 0 860 540" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="blobGrad" cx="36%" cy="36%" r="64%">
        <stop offset="0%"   stop-color="#FFA050"/>
        <stop offset="32%"  stop-color="#FF4DA5"/>
        <stop offset="68%"  stop-color="#A080FF"/>
        <stop offset="100%" stop-color="#7B61FF"/>
      </radialGradient>
      <linearGradient id="bowlBodyGrad" x1="10%" y1="0%" x2="90%" y2="100%">
        <stop offset="0%"   stop-color="#A080FF"/>
        <stop offset="55%"  stop-color="#7B61FF"/>
        <stop offset="100%" stop-color="#4A2ECC"/>
      </linearGradient>
      <linearGradient id="bowlRimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%"   stop-color="#C8B0FF"/>
        <stop offset="100%" stop-color="#8B71EE"/>
      </linearGradient>
      <radialGradient id="soupGrad" cx="42%" cy="42%" r="58%">
        <stop offset="0%"   stop-color="#FFA850"/>
        <stop offset="100%" stop-color="#E05200"/>
      </radialGradient>
      <linearGradient id="ladleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%"   stop-color="#EEE4FF"/>
        <stop offset="100%" stop-color="#9880CC"/>
      </linearGradient>
      <filter id="blobGlow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="14" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="bowlShadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="3" dy="7" stdDeviation="8" flood-color="#0B0E2E" flood-opacity="0.18"/>
      </filter>
    </defs>

    <!-- HALFTONE DOTS (JS fills this) -->
    <g id="ht" opacity="0"/>

    <!-- 1 · BLOB -->
    <path id="blob" opacity="0"
      d="M430,278 C472,212 562,198 588,252 C622,318 598,402 542,424
         C486,446 406,436 366,394 C314,340 338,252 430,278Z"
      fill="url(#blobGrad)" filter="url(#blobGlow)"/>

    <!-- 2 · STARS -->
    <g id="s1" opacity="0">
      <path d="M0-16 4-5 15-5 7 2 10 14 0 8-10 14-7 2-15-5-4-5Z"
            fill="#FF4DA5" transform="translate(148,148)"/>
    </g>
    <g id="s2" opacity="0">
      <path d="M0-13 3-4 12-4 5.5 2 8 12 0 7-8 12-5.5 2-12-4-3-4Z"
            fill="#FF7A30" transform="translate(712,118)"/>
    </g>
    <g id="s3" opacity="0">
      <path d="M0-11 2.8-3.5 10.5-3.5 4.5 1 7 10 0 5.5-7 10-4.5 1-10.5-3.5-2.8-3.5Z"
            fill="#17C3FF" transform="translate(122,418)"/>
    </g>
    <g id="s4" opacity="0">
      <path d="M0-12 3-3.8 11-3.8 5 1.5 7.5 11 0 6-7.5 11-5 1.5-11-3.8-3-3.8Z"
            fill="#9CE05A" transform="translate(738,400)"/>
    </g>

    <!-- tick accents -->
    <g id="ticks" opacity="0" stroke-linecap="round">
      <line x1="174" y1="222" x2="194" y2="202" stroke="#FF4DA5" stroke-width="3.5"/>
      <line x1="186" y1="219" x2="206" y2="199" stroke="#FF4DA5" stroke-width="2.5"/>
      <line x1="678" y1="178" x2="698" y2="158" stroke="#FF7A30" stroke-width="3.5"/>
      <line x1="690" y1="175" x2="710" y2="155" stroke="#FF7A30" stroke-width="2.5"/>
      <line x1="108" y1="428" x2="108" y2="438" stroke="#17C3FF" stroke-width="2.5"/>
      <line x1="103" y1="433" x2="113" y2="433" stroke="#17C3FF" stroke-width="2.5"/>
      <line x1="747" y1="377" x2="757" y2="377" stroke="#9CE05A" stroke-width="2.5"/>
      <line x1="752" y1="372" x2="752" y2="382" stroke="#9CE05A" stroke-width="2.5"/>
    </g>

    <!-- 3 · BOWL GROUP -->
    <g id="bowl" opacity="0" filter="url(#bowlShadow)">
      <ellipse cx="608" cy="490" rx="76" ry="14" fill="#0B0E2E" opacity="0.10"/>
      <ellipse cx="608" cy="482" rx="42" ry="10" fill="#4A2ECC"/>
      <rect x="584" y="462" width="48" height="24" rx="9" fill="#4A2ECC"/>
      <path d="M496,376 C490,458 546,478 608,480 C670,478 726,458 720,376Z"
            fill="url(#bowlBodyGrad)"/>
      <ellipse cx="608" cy="376" rx="112" ry="28" fill="url(#bowlRimGrad)"/>
      <ellipse cx="608" cy="376" rx="96"  ry="22" fill="url(#soupGrad)"/>
      <path d="M506,376 C504,390 552,397 608,397 C664,397 712,390 710,376"
            fill="#3B21C0" opacity="0.22"/>
      <ellipse cx="548" cy="408" rx="22" ry="12" fill="white" opacity="0.22"
               transform="rotate(-22 548 408)"/>
      <ellipse cx="535" cy="396" rx="8"  ry="5"  fill="white" opacity="0.40"
               transform="rotate(-22 535 396)"/>
    </g>

    <!-- 3 · LADLE -->
    <g id="ladle" opacity="0">
      <rect x="698" y="278" width="14" height="114" rx="7" fill="url(#ladleGrad)"/>
      <ellipse cx="705" cy="394" rx="27" ry="21" fill="#BEA8E0"/>
      <ellipse cx="705" cy="388" rx="20" ry="14" fill="#DDD0F8" opacity="0.78"/>
      <ellipse cx="697" cy="383" rx="5"  ry="3.5" fill="white" opacity="0.50"/>
    </g>

    <!-- 4 · STEAM -->
    <path class="stm" opacity="0"
          d="M574,370 Q566,342 572,318 Q578,294 570,272"
          stroke="white" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path class="stm" opacity="0"
          d="M608,365 Q600,337 606,313 Q612,289 604,267"
          stroke="white" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <path class="stm" opacity="0"
          d="M642,370 Q650,342 644,318 Q638,294 646,272"
          stroke="white" stroke-width="5" fill="none" stroke-linecap="round"/>

    <!-- 4 · VECTOR SHAPES -->
    <path id="vOrange" opacity="0"
          d="M672,178 C692,185 696,204 672,212 C648,204 652,185 672,178Z"
          fill="#FF7A30"/>
    <circle id="vPink" opacity="0" cx="414" cy="248" r="24" fill="#FF4DA5"/>
    <path id="vPurple" opacity="0"
          d="M516,172 C533,179 536,194 516,200 C496,194 499,179 516,172Z"
          fill="#7B61FF"/>
    <path id="vGreen" opacity="0"
          d="M543,182 C552,168 565,165 565,177 C565,190 552,195 543,182Z"
          fill="#9CE05A"/>
    <path id="vCyan" opacity="0"
          d="M442,160 C456,168 459,184 442,192 C425,184 428,168 442,160Z"
          fill="#17C3FF"/>

    <!-- 5 · WORDMARK -->
    <g id="txtG" opacity="0">
      <text id="txtO" opacity="0" x="308" y="326"
            font-family="'Arial Black','Impact','Helvetica Neue',sans-serif"
            font-size="94" font-weight="900" letter-spacing="-2"
            fill="none" stroke="#FF7A30" stroke-width="7">SOUPED</text>
      <text id="txtC" opacity="0" x="302" y="320"
            font-family="'Arial Black','Impact','Helvetica Neue',sans-serif"
            font-size="94" font-weight="900" letter-spacing="-2"
            fill="none" stroke="#17C3FF" stroke-width="7">SOUPED</text>
      <text id="txtM" opacity="0" x="305" y="323"
            font-family="'Arial Black','Impact','Helvetica Neue',sans-serif"
            font-size="94" font-weight="900" letter-spacing="-2"
            fill="#0B0E2E">SOUPED</text>
    </g>

    <!-- 6 · LOCAL BADGE -->
    <g id="badge" opacity="0">
      <rect x="204" y="252" width="106" height="32" rx="11" fill="#FFD700"/>
      <text x="257" y="274" text-anchor="middle"
            font-family="'Arial Black','Impact',sans-serif"
            font-size="14" font-weight="900" fill="#0B0E2E" letter-spacing="1.5">LOCAL</text>
    </g>
  </svg>
</div>

<button id="replay-btn">↺ REPLAY</button>

<!-- GSAP with unpkg fallback -->
<script>
  (function () {
    var s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js';
    s.onerror = function () {
      var f = document.createElement('script');
      f.src = 'https://unpkg.com/gsap@3.12.5/dist/gsap.min.js';
      f.onload = init;
      document.head.appendChild(f);
    };
    s.onload = init;
    document.head.appendChild(s);
  })();
</script>

<script>
/* ── Halftone grid ───────────────────────────────────────── */
function buildHalftone() {
  var layer   = document.getElementById('ht');
  var ns      = 'http://www.w3.org/2000/svg';
  var palette = ['#FF4DA5','#7B61FF','#FF7A30','#17C3FF','#9CE05A'];
  for (var col = 0; col < 24; col++) {
    for (var row = 0; row < 16; row++) {
      var x    = 14 + col * 36;
      var y    = 14 + row * 34;
      var dist = Math.hypot(x - 430, y - 320);
      var r    = Math.max(1.4, 5 - dist / 96);
      var c    = document.createElementNS(ns, 'circle');
      c.setAttribute('cx', x);
      c.setAttribute('cy', y);
      c.setAttribute('r',  r.toFixed(1));
      c.setAttribute('fill', palette[(col * 3 + row * 2) % palette.length]);
      c.setAttribute('opacity', '0.32');
      layer.appendChild(c);
    }
  }
}

/* ── Main init (called after GSAP loads) ─────────────────── */
function init() {
  buildHalftone();

  var tl = buildTL();
  var btn = document.getElementById('replay-btn');
  tl.eventCallback('onComplete', function () { btn.classList.add('ready'); });

  btn.addEventListener('click', function () {
    btn.classList.remove('ready');
    tl.kill();
    tl = buildTL();
    tl.eventCallback('onComplete', function () { btn.classList.add('ready'); });
  });
}

/* ── Timeline ────────────────────────────────────────────── */
function buildTL() {
  /* All elements already start at opacity:0 in SVG.
     We only need to set scale for pop-in elements. */
  gsap.set(['#blob','#s1','#s2','#s3','#s4',
            '#vOrange','#vPink','#vPurple','#vGreen','#vCyan'],
    { scale: 0 });

  gsap.set('#badge', { scale: 0, rotation: -12 });
  gsap.set('#bowl',  { y: 90 });
  gsap.set('#ladle', { x: 60, rotation: 26 });
  gsap.set('#txtM',  { scale: 1.22 });

  var tl = gsap.timeline({ delay: 0.3 });

  /* ── 1  BLOB blooms with squash-stretch ── */
  tl.to('#blob', {
    duration: 1.2, opacity: 1, scale: 1,
    ease: 'elastic.out(1, 0.48)'
  }, 0)
  .fromTo('#blob',
    { scaleX: 1.42, scaleY: 0.68 },
    { duration: 0.9, scaleX: 1, scaleY: 1, ease: 'elastic.out(1.1, 0.44)' },
    0.08
  );

  /* ── 2  HALFTONE + STARS ── */
  tl.to('#ht',    { duration: 0.55, opacity: 1 }, 1.0)
    .to('#s1',    { duration: 0.38, opacity: 1, scale: 1, ease: 'back.out(2.6)' }, 1.08)
    .to('#s2',    { duration: 0.38, opacity: 1, scale: 1, ease: 'back.out(2.6)' }, 1.18)
    .to('#s3',    { duration: 0.32, opacity: 1, scale: 1, ease: 'back.out(2.6)' }, 1.26)
    .to('#s4',    { duration: 0.32, opacity: 1, scale: 1, ease: 'back.out(2.6)' }, 1.34)
    .to('#ticks', { duration: 0.28, opacity: 1 }, 1.20);

  /* ── 3  BOWL ASSEMBLES ── */
  tl.to('#blob', { duration: 0.60, opacity: 0.12, scale: 0.60 }, 1.70)
    .to('#ht',   { duration: 0.40, opacity: 0.44 }, 1.76)
    .to('#bowl', {
      duration: 0.90, y: 0, opacity: 1,
      ease: 'back.out(1.55)'
    }, 1.88)
    .to('#ladle', {
      duration: 0.70, x: 0, rotation: 0, opacity: 1,
      ease: 'back.out(1.85)'
    }, 2.32);

  /* ── 4  STEAM + SHAPES ── */
  tl.to('.stm', {
    duration: 1.0, opacity: 0.78, y: -18,
    stagger: 0.14, ease: 'power1.out'
  }, 3.0)
  .to('#vOrange', { duration: 0.52, opacity: 1, scale: 1, ease: 'back.out(2.5)' }, 3.1)
  .to('#vPink',   { duration: 0.52, opacity: 1, scale: 1, ease: 'back.out(2.5)' }, 3.2)
  .to('#vPurple', { duration: 0.52, opacity: 1, scale: 1, ease: 'back.out(2.5)' }, 3.29)
  .to('#vGreen',  { duration: 0.52, opacity: 1, scale: 1, ease: 'back.out(2.5)' }, 3.38)
  .to('#vCyan',   { duration: 0.52, opacity: 1, scale: 1, ease: 'back.out(2.5)' }, 3.46);

  /* ── 5  SOUPED WORDMARK ── */
  tl.set('#txtG', { opacity: 1 }, 4.1)
    .to('#txtO', { duration: 0.22, opacity: 0.75 }, 4.1)
    .to('#txtC', { duration: 0.22, opacity: 0.75 }, 4.17)
    .to('#txtM', {
      duration: 0.58, opacity: 1, scale: 1,
      ease: 'back.out(2.2)'
    }, 4.28)
    .to(['#txtO','#txtC'], { duration: 0.40, opacity: 0.42 }, 4.68);

  /* ── 6  LOCAL BADGE ── */
  tl.to('#badge', {
    duration: 0.48, opacity: 1, scale: 1, rotation: 0,
    ease: 'back.out(3.2)'
  }, 5.18);

  /* ── SETTLE BOUNCE ── */
  tl.to(['#bowl','#txtG','#badge'], {
    duration: 0.22, y: '-=8', ease: 'power2.out'
  }, 5.50)
  .to(['#bowl','#txtG','#badge'], {
    duration: 0.34, y: '+=8', ease: 'bounce.out'
  }, 5.72)
  .to('.stm', { duration: 0.50, opacity: 0.32 }, 5.54);

  /* ── REPLAY BUTTON ── */
  tl.to('#replay-btn', { duration: 0.50, opacity: 1 }, 6.2);

  return tl;
}
</script>
</body>
</html>
